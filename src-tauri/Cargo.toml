[package]
name = "meetphant"
version = "0.4.0"
description = "Meetphant desktop meeting assistant"
authors = ["Meetphant"]
edition = "2021"

[lib]
name = "meetphant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Platform credential stores must be enabled explicitly in keyring v3;
# without them the crate falls back to an in-process mock that does not persist.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
ve-tos-rust-sdk = { version = "2.9.19", default-features = false, features = ["use-rustls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.15"
hound = "3.5"
dirs = "5"
# CLI wrapper only — we download the Windows essentials zip ourselves (avoids xz2).
ffmpeg-sidecar = { version = "2", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-process = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }
tracing-appender = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
